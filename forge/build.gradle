plugins {
    id "com.gradleup.shadow"

    id "com.modrinth.minotaur"
    id "com.matthewprenger.cursegradle"
}

architectury {
    injectInjectables = false
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "${mod_id}.common.mixins.json"
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge}"

    // Dependencies
    def path = "${project.parent.path}:common" // Get the correct path, even if we are in a multiproject setup
    common(project(path: path, configuration: "namedElements")) { transitive = false }
    shadowBundle(project(path: path, configuration: "transformProductionForge"))
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

modrinth {
    debugMode = providers.environmentVariable("MODRINTH_TOKEN").getOrNull() == null

    token = providers.environmentVariable("MODRINTH_TOKEN").getOrElse("")

    projectId = 'rideablepolarbears'
    versionNumber = version
    versionName = "${mod_name}-${version}"
    versionType = 'release'
    file = remapJar.archiveFile
    changelog = project.file('../CHANGELOG.md').text
    gameVersions = [project.minecraft_version]
    loaders = ['forge']
    detectLoaders = false

    /*dependencies {
        // A special DSL for creating dependencies
        // scope.type
        // The scope can be `required`, `optional`, `incompatible`, or `embedded`
        // The type can either be `project` or `version`
    }*/
}

curseforge {
    curseGradleOptions.debug = providers.environmentVariable("CURSEFORGE_TOKEN").getOrNull() == null

    apiKey = providers.environmentVariable("CURSEFORGE_TOKEN").getOrElse("invalid")

    curseGradleOptions.javaIntegration = false
    curseGradleOptions.forgeGradleIntegration = false
    curseGradleOptions.javaVersionAutoDetect = false

    //noinspection GroovyAssignabilityCheck
    project {
        id = '932424'
        releaseType = 'release'
        changelogType = 'markdown'
        changelog = project.file('../CHANGELOG.md')

        addGameVersion project.minecraft_version
        addGameVersion 'Forge'

        mainArtifact(remapJar) {
            displayName = "${mod_name}-${version}"
        }

        /*relations {
        }*/
    }
}