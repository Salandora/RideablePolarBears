name: Release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        java: [ 21 ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            **/.gradle/loom-cache
          key: ${{ runner.os }}-java-${{ matrix.java }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-java-${{ matrix.java }}-gradle-

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Get properties Name
        run: |
          grep "mod_name" gradle.properties | sed "s/\s//g" >> $GITHUB_ENV
          grep "mod_version" gradle.properties | sed "s/\s//g" >> $GITHUB_ENV
          grep "minecraft_version" gradle.properties | sed "s/\s//g" >> $GITHUB_ENV

      - uses: gradle/wrapper-validation-action@v1

      - name: Set execute permission
        run: chmod +x gradlew

      - name: Generate changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          PREV_TAG=$(gh release list --limit 50 --json tagName \
            --jq ".[] | select(.tagName | endswith(\"-${minecraft_version}\")) | .tagName" \
            | head -n 1 || true)

          if [ -z "$PREV_TAG" ]; then
            {
              echo "# Changelog"
              echo
              echo "- Updated to Minecraft ${minecraft_version}"
            } > CHANGELOG.md
            exit 0
          fi

          RANGE="$PREV_TAG..$GITHUB_SHA"
          NEW_TAG="${mod_version}-${minecraft_version}"
          FULL_CHANGELOG="- Full changelog: [${PREV_TAG}...${NEW_TAG}](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${NEW_TAG})"

          FEATURES=$(git log $RANGE --pretty='%s (%h)' \
            | grep '^\[Feat\]:' \
            | sed 's/^\[Feat\]: /- /' || true)
          
          FIXES=$(git log $RANGE --pretty='%s (%h)' \
            | grep '^\[Fix\]:' \
            | sed 's/^\[Fix\]: /- /' || true)
          
          OTHER=$(git log $RANGE --pretty='%s (%h)' \
            | grep -v '^\[Feat\]:' \
            | grep -v '^\[Fix\]:' \
            | sed -E 's/^\[[^]]+\]: /- /' \
            | sed 's/^/- /' || true)

          {
            echo "# Changelog"
            echo
            [ -n "$FEATURES" ] && echo "## Features" && echo "$FEATURES" && echo
            [ -n "$FIXES" ] && echo "## Fixes" && echo "$FIXES" && echo
            [ -n "$OTHER" ] && echo "## Other" && echo "$OTHER" && echo
            echo "$FULL_CHANGELOG" && echo
          } > CHANGELOG.md

      - name: Publish
        if: ${{ !env.ACT }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE: true
        run: ./gradlew build publish curseforge modrinth

      - name: Create Release
        if: ${{ !env.ACT }}
        id: create_release
        uses: ncipollo/release-action@v1.20.0
        with:
          tag: ${{ env.mod_version }}-${{ env.minecraft_version }}
          name: ${{ env.mod_name }} ${{ env.mod_version }}-${{ env.minecraft_version }}
          bodyFile: CHANGELOG.md
          draft: false
          prerelease: false
          artifacts: "fabric/build/libs/${{ env.mod_name }}-${{ env.mod_version }}+${{ env.minecraft_version }}-fabric.jar,
            forge/build/libs/${{ env.mod_name }}-${{ env.mod_version }}+${{ env.minecraft_version }}-forge.jar,
            neoforged/build/libs/${{ env.mod_name }}-${{ env.mod_version }}+${{ env.minecraft_version }}-neoforged.jar"